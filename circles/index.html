\nX（旧Twitter）：\nhttps://twitter.com/OU_ojousamaclub  \n\nInstagram\nhttps://www.instagram.com/ou_ojousamaclub  \n\nWebページ：\nhttps://ou-ojousamaclub.com  \n\nメールアドレス：\nouojousamaclub@gmail.com  \n\n"},{"title":"阪大ミュージアム同好会","date":"2024-4-24","slug":"circles/027","coverImage":"/assets/027/cover.jpg","iconImage":"/assets/027/icon.png","excerpt":"","tags":["サークル","活動中"],"content":"\n## サークル情報\n- サークル名: 阪大ミュージアム同好会\n- 部員数: 19\n- 創設年月日: 2022/05/13\n- 活動場所: 関西各地のミュージアム\n\n- 活動内容:博物館、美術館、動植物園…といったミュージアムを見学して、見学後にはご飯を食べながら思ったことをゆるくあれこれ話しています。\n\n## メッセージ\nいろいろな興味関心を持った部員たちが、毎回の活動でワイワイあれこれ話しています。ミュージアムと聞くと、敷居が高い印象を覚える人もいるかもしれませんが、そんな人も大歓迎！専門知識は一切いりません！もちろん、ミュージアムがもとから好きな人も大歓迎です。\n\n## お問い合わせ先\nX(旧Twitter):https://x.com/HA_Museumclub?t=ReIU1iAWBXrUJqxSNCt4xw\u0026s=09  \nInstagram:https://www.instagram.com/handai_museumclub?igsh=MWkzaGM4d2N3a292Zg==  \nメール:handaimuseumclub@gmail.com\n\n"},{"title":"大阪大学色彩検定筋トレサークル","date":"2024-4-4","slug":"circles/017","coverImage":"/assets/017/cover.jpg","iconImage":"/assets/017/icon.png","excerpt":"","tags":["サークル","活動中"],"content":"\n## サークル情報\n- サークル名: 大阪大学色彩検定筋トレサークル\n- 部員数: 56\n- 創設年月日: 2022/9/27\n- 活動場所: 豊中キャンパス周辺など\n\n- 活動内容:色彩や筋トレに関連するすべてのこと。\n  特に普段の活動では色彩検定に向けた勉強会や筋トレの報告スレッドなどを使って、モチベーションの維持や緩やかな交流をオンラインベースで行っています。\n  色彩検定以外の色彩に関連した資格や検定に挑戦する部員もいれば、色彩に少し興味があって入会した部員もいます。また、健康維持やダイエットを目的に筋トレをしている部員もいれば、大会出場などをしている部員もいます。サークル全体としては緩やかな活動ですが、人それぞれマイペースに取り組めるサークルです。色彩のみ、筋トレのみでの参加も可能です。\n  また、年に2回ある大学祭ではパーソナルカラー診断などを行っています。\n\n## メッセージ\n新入生はもちろん在学生も大歓迎です！\n\n## お問い合わせ先\nX(旧Twitter):@SHIKIkin_OU  \nInstagram:@shikikik_ou\n\n"}]},"__N_SSG":true},"page":"/circles","query":{},"buildId":"IEe1oIROTaF2CjthgP_1O","assetPrefix":"/hp","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
